# CI — compile the contract with the pinned toolchain, then run the keyless simulation tier.
#
# WHAT THIS DELIBERATELY DOES NOT DO: no Midnight node, no indexer, no proof server, no proving
# keys, no SRS download, no deployment. Those belong to the integration tier
# (`scripts/test-integration.sh`), which is run on demand. This workflow is meant to finish in
# minutes on every push, and it needs no repository secrets at all.
#
# ARCHITECTURE. The pinned Compact compiler binary is `aarch64-unknown-linux-musl`, so this job
# MUST run on an arm64 runner. `ubuntu-24.04-arm` is GitHub-hosted and free for public
# repositories. On an x86_64 runner the compiler cannot execute at all.
#
# FULL HISTORY IS REQUIRED (`fetch-depth: 0`). Twenty of the simulation tests are differential
# against the last pre-v5 Manager, which is a frozen reference rather than a second product and so
# lives in this repository's history rather than in the tree. `scripts/compile.sh` reads it from a
# pinned commit and verifies its SHA-256 before compiling it. A shallow clone cannot see it.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read      # to pull the toolchain image from GHCR with the built-in GITHUB_TOKEN

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The published pinned toolchain. Pulled by tag and then IDENTITY-CHECKED by image ID below,
  # which is what actually pins it: unlike a manifest digest, the image ID is the config digest and
  # survives push/pull unchanged, so it identifies the same bytes regardless of registry.
  TOOLCHAIN_IMAGE: ghcr.io/acedward/aa-compactc:0.33.0
  TOOLCHAIN_IMAGE_ID: sha256:f57ca2d88cec1c66f377eb8bb2d616779202dd1ccb99517a4f7ddfffa9d0d86b
  LOCAL_TAG: aa-compactc:ci

jobs:
  compile-and-simulate:
    name: compile + simulation tier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout (full history — needed for the k=20 reference oracle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtain the pinned Compact toolchain
        run: |
          set -uo pipefail
          # PRIMARY PATH: pull the published image and prove it is the pinned one by image ID.
          if docker pull -q "$TOOLCHAIN_IMAGE"; then
            got="$(docker image inspect "$TOOLCHAIN_IMAGE" --format '{{.Id}}')"
            if [ "$got" != "$TOOLCHAIN_IMAGE_ID" ]; then
              echo "::error::pulled toolchain is not the pinned one: $got != $TOOLCHAIN_IMAGE_ID"
              exit 1
            fi
            echo "toolchain: pulled $TOOLCHAIN_IMAGE (image id verified)"
            docker tag "$TOOLCHAIN_IMAGE" "$LOCAL_TAG"
          else
            # FALLBACK: build it from docker/compactc.Dockerfile, which pins the compiler ARCHIVE by
            # SHA-256 and verifies it with `sha256sum -c` during the build. That is a stronger
            # primitive than the image digest — the image is only a wrapper around that archive — so
            # the compiler binary is identical either way. It is a fallback rather than the plan
            # because it depends on the upstream release URL staying reachable, which is exactly the
            # fragility the published image exists to remove.
            echo "::warning::could not pull $TOOLCHAIN_IMAGE — building the toolchain from docker/compactc.Dockerfile instead (the archive is SHA-256 pinned). Publish the image to make this path unnecessary."
            docker build -q -f docker/compactc.Dockerfile -t "$LOCAL_TAG" . || exit 1
          fi
          # Either way, the compiler must report exactly the pinned versions.
          ver="$(docker run --rm --network none "$LOCAL_TAG" compactc --version | tr -d '[:space:]')"
          lang="$(docker run --rm --network none "$LOCAL_TAG" compactc --language-version | tr -d '[:space:]')"
          echo "compiler=$ver language=$lang"
          [ "$ver" = "0.33.0" ] && [ "$lang" = "0.25.0" ] || {
            echo "::error::toolchain version mismatch: compiler=$ver language=$lang"; exit 1; }

      - name: Compile the contracts
        env:
          COMPACTC_IMAGE: ${{ env.LOCAL_TAG }}
        run: scripts/compile.sh all

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the simulation tier
        env:
          AA_TEST_RUNTIME: native
        run: scripts/test-sim.sh --skip-compile
