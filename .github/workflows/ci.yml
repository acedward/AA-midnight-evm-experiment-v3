# CI — compile the contract with the pinned toolchain, then run the keyless simulation tier.
#
# WHAT THIS DELIBERATELY DOES NOT DO: no Midnight node, no indexer, no proof server, no proving
# keys, no SRS download, no deployment. Those belong to the integration tier
# (`scripts/test-integration.sh`), which is run on demand. This workflow is meant to finish in
# minutes on every push, and it needs no repository secrets at all.
#
# ARCHITECTURE. The pinned Compact compiler binary is `aarch64-unknown-linux-musl`, so this job
# MUST run on an arm64 runner. `ubuntu-24.04-arm` is GitHub-hosted and free for public
# repositories. On an x86_64 runner the compiler cannot execute at all.
#
# FULL HISTORY IS REQUIRED (`fetch-depth: 0`). Twenty of the simulation tests are differential
# against the last pre-v5 Manager, which is a frozen reference rather than a second product and so
# lives in this repository's history rather than in the tree. `scripts/compile.sh` reads it from a
# pinned commit and verifies its SHA-256 before compiling it. A shallow clone cannot see it.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read      # to pull the toolchain image from GHCR with the built-in GITHUB_TOKEN

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned toolchain: Compact compiler 0.34.0, language 0.26.0 (Midnight ledger 9). The pin of
  # record is the release-archive SHA-256 in docker/compactc.Dockerfile; scripts/toolchain.sh
  # obtains the image (published cache first when one is configured, Dockerfile build otherwise)
  # and then PROVES what arrived by checking the compiler version, the language version and the
  # SHA-256 of `compactc.bin` and `zkir-v3`. Set COMPACTC_PUBLISHED_IMAGE to a digest-pinned
  # published image to use it as a cache; empty means "build from the archive", which is a fully
  # verified path and not a degraded one.
  COMPACTC_IMAGE: aa-compactc:ci
  COMPACTC_PUBLISHED_IMAGE: ''

jobs:
  compile-and-simulate:
    name: compile + simulation tier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout (full history — needed for the k=20 reference oracle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: env.COMPACTC_PUBLISHED_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One script obtains the toolchain and proves its identity (version, language version, and
      # the SHA-256 of both compiler binaries), so CI and a developer's laptop cannot diverge. It
      # is a separate step only so a toolchain failure is legible in the job log; compile.sh would
      # run exactly the same code.
      - name: Obtain the pinned Compact toolchain
        run: scripts/toolchain.sh

      # THE PARTITION GATE (project 00014, SC-005). Text-only, no Docker, instant — so it runs
      # BEFORE the compile: a stateful module imported twice (compiler bug #270) or a registry write
      # that escaped its module is reported in seconds rather than after the build. It checks WHERE
      # code lives, which no compiler error and no test would catch.
      - name: Partition gate (single-import rule, registry writes)
        run: scripts/check-partition.sh

      - name: Compile the contracts
        run: scripts/compile.sh all

      # THE ARTIFACT GATE (project 00014, FR-016). Runs on the artifact the step above just built,
      # so it recompiles nothing, and measures ALL NINE proof-bearing circuits: `execute` has 27%
      # headroom under k=19 but `depositUnshielded` sits 274 rows (3.3%) under its k=13 ceiling, so
      # gating on `execute` alone would miss the likeliest regression. Measured cost of the whole
      # gate on darwin/arm64: 37 s for compile + nine measurements, a small fraction of this job's
      # 20-minute budget. `scripts/check-artifact.sh --circuits execute` is the trim if the arm
      # runner ever makes the full set too slow.
      - name: Artifact gate (rows, k, generated surface)
        run: scripts/check-artifact.sh --skip-compile

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The 00014 refusal matrix runs here with the rest of the tier; it needs no wiring of its own.
      # It does read `contracts/**/*.compact` at test time for its coverage assertion, which the
      # native runtime finds next to `tests/` (the Docker runtime stages it into the run volume).
      - name: Run the simulation tier
        env:
          AA_TEST_RUNTIME: native
        run: scripts/test-sim.sh --skip-compile
